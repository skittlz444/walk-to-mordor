<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  
  <!-- Walking figure -->
  <g transform="translate(96,96)" fill="#ffffff">
    <!-- Head -->
    <circle cx="0" cy="-45" r="12"/>
    
    <!-- Body -->
    <rect x="-8" y="-30" width="16" height="35" rx="8"/>
    
    <!-- Arms -->
    <rect x="-20" y="-25" width="8" height="25" rx="4" transform="rotate(-20)"/>
    <rect x="12" y="-25" width="8" height="25" rx="4" transform="rotate(20)"/>
    
    <!-- Legs in walking position -->
    <rect x="-12" y="5" width="8" height="30" rx="4" transform="rotate(-15)"/>
    <rect x="4" y="5" width="8" height="30" rx="4" transform="rotate(10)"/>
    
    <!-- Walking path/trail -->
    <path d="M -50,40 Q -20,35 10,40 Q 40,45 70,40" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
    <circle cx="-40" cy="38" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="-10" cy="39" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="20" cy="41" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="50" cy="39" r="2" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- App title -->
  <text x="96" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">WALK TO</text>
  <text x="96" y="180" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">MORDOR</text>
</svg>