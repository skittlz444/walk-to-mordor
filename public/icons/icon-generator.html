<!DOCTYPE html>
<html>
<head>
    <style>
        .icon-192 { 
            width: 192px; 
            height: 192px; 
            background: radial-gradient(circle, #0f3460 0%, #1a1a2e 100%);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            position: relative;
        }
        .icon-512 { 
            width: 512px; 
            height: 512px; 
            background: radial-gradient(circle, #0f3460 0%, #1a1a2e 100%);
            border-radius: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            position: relative;
        }
        .walking-figure-192 {
            width: 60px;
            height: 80px;
            position: relative;
            margin-bottom: 20px;
        }
        .walking-figure-512 {
            width: 160px;
            height: 200px;
            position: relative;
            margin-bottom: 50px;
        }
        .head { 
            width: 20px; 
            height: 20px; 
            background: white; 
            border-radius: 50%; 
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .body { 
            width: 16px; 
            height: 35px; 
            background: white; 
            border-radius: 8px; 
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
        }
        .title-192 { font-size: 16px; font-weight: bold; text-align: center; }
        .title-512 { font-size: 42px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="icon-192" id="icon192">
        <div class="walking-figure-192">
            <div class="head"></div>
            <div class="body"></div>
        </div>
        <div class="title-192">WALK TO<br>MORDOR</div>
    </div>
    
    <div class="icon-512" id="icon512" style="margin-top: 50px;">
        <div class="walking-figure-512">
            <div class="head" style="width: 50px; height: 50px;"></div>
            <div class="body" style="width: 40px; height: 90px; top: 65px;"></div>
        </div>
        <div class="title-512">WALK TO<br>MORDOR</div>
    </div>
</body>
</html>
