name: PR Integration Tests (Post-Deploy)

on:
  # This workflow will be triggered by external deployment completion
  # For now, it can be triggered manually or via repository dispatch
  repository_dispatch:
    types: [deployment-complete]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to test against'
        required: true
        type: string

env:
  NODE_VERSION: '22'

jobs:
  # API integration tests against deployed URL
  api-tests-deployed:
    name: API Tests (Deployed)
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || github.event.client_payload.deployment_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure API tests for deployed URL
        run: |
          echo "Testing against deployed URL: $DEPLOYMENT_URL"
          # Create a temporary test configuration that uses the deployed URL
          cat > tests/config/deployed.js << EOF
          module.exports = {
            baseURL: '$DEPLOYMENT_URL',
            timeout: 30000
          };
          EOF
          
      - name: Run API tests against deployed URL
        run: |
          # Temporarily modify the API test to use the deployed URL
          sed -i "s|const server = 'http://localhost:8787';|const server = '$DEPLOYMENT_URL';|g" tests/api.success.test.js
          sed -i "s|const server = 'http://localhost:8787';|const server = '$DEPLOYMENT_URL';|g" tests/api.errors.test.js
          
          # Run the API tests
          npm run test:api:all
          
      - name: Restore API test configuration
        if: always()
        run: |
          # Restore original configuration
          git checkout tests/api.success.test.js tests/api.errors.test.js 2>/dev/null || true

  # UI end-to-end tests against deployed URL
  ui-tests-deployed:
    name: UI Tests (Deployed)
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || github.event.client_payload.deployment_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Configure UI tests for deployed URL
        run: |
          echo "Testing against deployed URL: $DEPLOYMENT_URL"
          # Create a CI-specific Playwright config
          cat > playwright.ci.config.js << EOF
          const { defineConfig, devices } = require('@playwright/test');
          
          module.exports = defineConfig({
            testDir: './tests',
            testMatch: '**/*.spec.js',
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: process.env.CI ? 2 : 0,
            workers: process.env.CI ? 1 : undefined,
            reporter: 'html',
            use: {
              baseURL: '$DEPLOYMENT_URL',
              trace: 'on-first-retry',
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
              {
                name: 'firefox',
                use: { ...devices['Desktop Firefox'] },
              },
              {
                name: 'Mobile Chrome',
                use: { ...devices['Pixel 5'] },
              },
            ],
            // No local webServer for deployed tests
          });
          EOF
          
      - name: Run UI tests against deployed URL
        run: npx playwright test --config=playwright.ci.config.js tests/ui.success.spec.js tests/ui.edge-cases.spec.js --reporter=list
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-deployed
          path: playwright-report/
          retention-days: 7
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-deployed
          path: test-results/
          retention-days: 7

  # Report results
  deployed-tests-complete:
    name: Deployed Tests Complete
    runs-on: ubuntu-latest
    needs: [api-tests-deployed, ui-tests-deployed]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "API tests (deployed): ${{ needs.api-tests-deployed.result }}"
          echo "UI tests (deployed): ${{ needs.ui-tests-deployed.result }}"
          
          if [[ "${{ needs.api-tests-deployed.result }}" != "success" ]]; then
            echo "❌ API tests against deployed URL failed"
            exit 1
          fi
          
          if [[ "${{ needs.ui-tests-deployed.result }}" != "success" ]]; then
            echo "❌ UI tests against deployed URL failed"
            exit 1
          fi
          
          echo "✅ All deployed tests passed successfully!"