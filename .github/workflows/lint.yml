name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check Generated Worker Types
        run: npx wrangler types --check --strict-vars=false

      - name: Check Generated Client Validators
        run: npm run check:validators

      - name: Check Asset Count
        run: npm run check:assets

      # The version checks hash the built client bundle, so build it first.
      - name: Build Client Bundle
        run: npm run build:client

      - name: Check Asset Versions
        run: npm run check:assets:versions

      - name: Check Asset References
        run: npm run check:assets:refs

      - name: Check Service Worker
        run: npm run check:service-worker

      - name: Check Image Manifest
        run: npm run check:image-manifest
