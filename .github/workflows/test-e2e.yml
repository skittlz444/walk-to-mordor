name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Client
        run: npm run build:client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1

      - name: Run E2E Tests (all browsers on main, chromium-only on other branches)
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            npx playwright test
          else
            npx playwright test --project=chromium
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/playwright-junit.xml
          check_name: E2E Tests
          comment_mode: always
