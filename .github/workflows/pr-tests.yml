name: PR Tests

on:
  # Run on pull requests targeting any branch
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback - Unit tests and code coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test:unit
        
      - name: Generate coverage report
        run: npm run test:coverage:unit
        
      - name: Generate coverage JUnit XML
        if: always()
        run: node tests/generate-reports.js coverage-junit
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-html
          path: coverage/
          retention-days: 7
          
      - name: Upload coverage results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: test-results/coverage-junit.xml
          retention-days: 7
          
      - name: Upload test results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/junit.xml
          retention-days: 7
          
      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
          
      - name: Publish Coverage Results
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('test-results/coverage-junit.xml') != ''
        with:
          name: Coverage Report
          path: test-results/coverage-junit.xml
          reporter: java-junit
          fail-on-error: false
          
  # API integration tests - runs with local dev server
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Start Cloudflare Workers dev server
        run: |
          echo "Starting Cloudflare Workers dev server in background..."
          timeout 300 npm run dev &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready
          echo "Waiting for dev server to start..."
          timeout 90 bash -c 'until curl -f http://localhost:8787/wtm/ > /dev/null 2>&1; do echo "Waiting for server..."; sleep 3; done'
          echo "✅ Dev server is ready!"
        
      - name: Run API tests
        run: npm run test:api:all
        
      - name: Generate API HTML report
        if: always()
        run: node tests/generate-reports.js api-report
        
      - name: Create API reports archive
        if: always()
        run: |
          mkdir -p api-reports
          # Only copy files if they exist
          if [ -f test-results/api-report.html ]; then
            cp test-results/api-report.html api-reports/
          fi
          if [ -f test-results/junit.xml ]; then
            cp test-results/junit.xml api-reports/api-junit.xml
          fi
          
      - name: Upload API test reports (Zipped HTML)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('api-reports/*') != ''
        with:
          name: api-test-reports-html
          path: api-reports/
          retention-days: 7
          
      - name: Upload API test results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/junit.xml') != ''
        with:
          name: api-test-results
          path: test-results/junit.xml
          retention-days: 7
          
      - name: Publish API Test Results
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('test-results/junit.xml') != ''
        with:
          name: API Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
        
      - name: Stop dev server
        if: always()
        run: |
          if [ ! -z "$DEV_PID" ]; then
            echo "Stopping dev server (PID: $DEV_PID)"
            kill $DEV_PID 2>/dev/null || true
            # Kill any remaining wrangler processes
            pkill -f "wrangler" || true
          fi

  # UI end-to-end tests - runs with Playwright's built-in dev server
  ui-tests:
    name: UI End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Run UI tests
        run: npx playwright test tests/ui.success.spec.js tests/ui.edge-cases.spec.js
        
      - name: Create UI reports archive
        if: always()
        run: |
          mkdir -p ui-reports
          # Only copy files if they exist
          if [ -d playwright-report ] && [ "$(ls -A playwright-report 2>/dev/null)" ]; then
            cp -r playwright-report/* ui-reports/ 2>/dev/null || true
          fi
          if [ -d test-results ] && [ "$(ls -A test-results 2>/dev/null)" ]; then
            cp -r test-results/* ui-reports/ 2>/dev/null || true
          fi
        
      - name: Upload Playwright report (Zipped HTML)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('ui-reports/*') != ''
        with:
          name: ui-test-reports-html
          path: ui-reports/
          retention-days: 7
          
      - name: Upload UI test results (JUnit XML)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('test-results/playwright-junit.xml') != ''
        with:
          name: ui-test-results
          path: test-results/playwright-junit.xml
          retention-days: 7
          
      - name: Publish UI Test Results
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('test-results/playwright-junit.xml') != ''
        with:
          name: UI Tests
          path: test-results/playwright-junit.xml
          reporter: java-junit
          fail-on-error: false

