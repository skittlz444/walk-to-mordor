name: PR Tests

on:
  # Run on pull requests targeting any branch
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback - Unit tests and code coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm test
        
      - name: Generate coverage report
        run: npm run test:coverage
        
      - name: Generate coverage JUnit XML
        if: always()
        run: node tests/api/generate-reports.js coverage-junit
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-html
          path: coverage/
          retention-days: 7
          
      - name: Upload coverage results (JUnit XML)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-results
          path: test-results/coverage-junit.xml
          retention-days: 7
          
      - name: Upload test results (JUnit XML)
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-results
          path: test-results/junit.xml
          retention-days: 7
          
      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Unit Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
          
      - name: Check if coverage JUnit XML exists
        id: check_coverage_junit
        run: |
          if [ -f test-results/coverage-junit.xml ]; then
            echo "coverage_junit_exists=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_junit_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Coverage Results
        uses: dorny/test-reporter@v2
        if: always() && steps.check_coverage_junit.outputs.coverage_junit_exists == 'true'
        with:
          name: Coverage Report
          path: test-results/coverage-junit.xml
          reporter: java-junit
          fail-on-error: false
          


  # UI end-to-end tests - runs with Playwright's built-in dev server
  ui-tests:
    name: UI End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Run UI tests
        run: npm run test:ui
        
      - name: Create UI reports archive
        if: always()
        run: |
          mkdir -p ui-reports
          # Only copy files if they exist
          if [ -d playwright-report ] && [ "$(ls -A playwright-report 2>/dev/null)" ]; then
            cp -r playwright-report/* ui-reports/ 2>/dev/null || true
          fi
          if [ -d test-results ] && [ "$(ls -A test-results 2>/dev/null)" ]; then
            cp -r test-results/* ui-reports/ 2>/dev/null || true
          fi
        
      - name: Upload Playwright report (Zipped HTML)
        uses: actions/upload-artifact@v6
        if: always() && hashFiles('ui-reports/*') != ''
        with:
          name: ui-test-reports-html
          path: ui-reports/
          retention-days: 7
          
      - name: Upload UI test results (JUnit XML)
        uses: actions/upload-artifact@v6
        if: always() && hashFiles('test-results/playwright-junit.xml') != ''
        with:
          name: ui-test-results
          path: test-results/playwright-junit.xml
          retention-days: 7
          
      - name: Publish UI Test Results
        uses: dorny/test-reporter@v2
        if: always() && hashFiles('test-results/playwright-junit.xml') != ''
        with:
          name: UI Tests
          path: test-results/playwright-junit.xml
          reporter: java-junit
          fail-on-error: false

