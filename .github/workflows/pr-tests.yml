name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Build Client
        run: npm run build:client
        
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1

      - name: Run E2E Tests
        id: e2e-tests
        run: npm run test:ui
        continue-on-error: true

      - name: Run Unit Tests & Coverage
        id: unit-tests
        run: npm run test:coverage
        continue-on-error: true

      - name: Run Client Unit Tests
        id: client-tests
        run: npm run test:client:coverage
        continue-on-error: true
        
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            test-results/junit.xml
            test-results/playwright-junit.xml
            test-results/client/junit.xml
          check_name: Test Results
          comment_mode: always
          
      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Report Coverage
        if: always() && steps.client-tests.outcome != 'skipped'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: './coverage/client/coverage-summary.json'
          name: 'Client Coverage'

      - name: Check for test failures
        if: always()
        run: |
          if [ "${{ steps.unit-tests.outcome }}" == "failure" ] || [ "${{ steps.e2e-tests.outcome }}" == "failure" ] || [ "${{ steps.client-tests.outcome }}" == "failure" ]; then
            echo "One or more test suites failed"
            exit 1
          fi
