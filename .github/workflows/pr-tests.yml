name: PR Tests

on:
  # Run on pull requests targeting any branch
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22'

jobs:
  # Fast feedback - Unit tests and code coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test:unit
        
      - name: Generate coverage report
        run: npm run test:coverage:unit
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  # API integration tests - runs with local dev server
  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Start Cloudflare Workers dev server
        run: |
          echo "Starting Cloudflare Workers dev server in background..."
          timeout 300 npm run dev &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready
          echo "Waiting for dev server to start..."
          timeout 90 bash -c 'until curl -f http://localhost:8787/wtm/ > /dev/null 2>&1; do echo "Waiting for server..."; sleep 3; done'
          echo "✅ Dev server is ready!"
        
      - name: Run API tests
        run: npm run test:api:all
        
      - name: Stop dev server
        if: always()
        run: |
          if [ ! -z "$DEV_PID" ]; then
            echo "Stopping dev server (PID: $DEV_PID)"
            kill $DEV_PID 2>/dev/null || true
            # Kill any remaining wrangler processes
            pkill -f "wrangler" || true
          fi

  # UI end-to-end tests - runs with Playwright's built-in dev server
  ui-tests:
    name: UI End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Run UI tests
        run: npm run test:ui:all
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Final validation - all tests must pass
  tests-complete:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "API tests: ${{ needs.api-tests.result }}"
          echo "UI tests: ${{ needs.ui-tests.result }}"
          
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.api-tests.result }}" != "success" ]]; then
            echo "❌ API tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.ui-tests.result }}" != "success" ]]; then
            echo "❌ UI tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed successfully!"