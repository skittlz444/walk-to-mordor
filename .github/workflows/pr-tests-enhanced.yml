name: Enhanced PR Tests with Deployment Detection

on:
  # Run on all branch pushes
  push:
  # Run on all pull requests (regardless of target branch)
  pull_request:
    types: [opened, synchronize, reopened]
  # This allows the workflow to be triggered when deployment status changes
  status: {}
  deployment_status: {}

env:
  NODE_VERSION: '18'

jobs:
  # Fast feedback - Unit tests and code coverage
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test:unit
        
      - name: Generate coverage report
        run: npm run test:coverage:unit
        
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 7

  # API integration tests with local dev server
  api-tests:
    name: API Integration Tests (Local)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Start Cloudflare Workers dev server in background
        run: |
          echo "Starting Cloudflare Workers dev server..."
          npm run dev &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready
          echo "Waiting for dev server to start..."
          timeout 60 bash -c 'until curl -f http://localhost:8787/wtm/ > /dev/null 2>&1; do sleep 2; done'
          echo "Dev server is ready!"
        
      - name: Run API tests
        run: npm run test:api:all
        
      - name: Stop dev server
        if: always()
        run: |
          if [ ! -z "$DEV_PID" ]; then
            kill $DEV_PID || true
          fi

  # UI end-to-end tests with local dev server
  ui-tests:
    name: UI End-to-End Tests (Local)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Wrangler
        run: npm install -g wrangler
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Setup local D1 database
        run: |
          echo "Setting up local D1 database for testing..."
          npm run seedLocalD1
        
      - name: Run UI tests
        run: npm run test:ui:all
        
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Wait for Cloudflare deployment and run integration tests against deployed URL
  deployed-tests:
    name: Integration Tests (Deployed)
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Wait for Cloudflare deployment
        id: wait-deploy
        uses: actions/github-script@v7
        timeout-minutes: 10
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            
            console.log(`Looking for deployment for SHA: ${sha}`);
            
            // Function to check for deployment
            async function checkDeployment() {
              try {
                // Method 1: Check deployment statuses
                const deployments = await github.rest.repos.listDeployments({
                  owner,
                  repo,
                  sha,
                  per_page: 10
                });
                
                for (const deployment of deployments.data) {
                  const statuses = await github.rest.repos.listDeploymentStatuses({
                    owner,
                    repo,
                    deployment_id: deployment.id,
                  });
                  
                  const latestStatus = statuses.data[0];
                  if (latestStatus && latestStatus.state === 'success') {
                    const url = latestStatus.target_url || latestStatus.environment_url;
                    if (url) {
                      console.log(`Found successful deployment: ${url}`);
                      return url;
                    }
                  }
                }
                
                // Method 2: Check commit statuses for Cloudflare
                const statuses = await github.rest.repos.listCommitStatusesForRef({
                  owner,
                  repo,
                  ref: sha
                });
                
                for (const status of statuses.data) {
                  if (status.context && 
                      (status.context.includes('cloudflare') || 
                       status.context.includes('pages')) && 
                      status.state === 'success' &&
                      status.target_url) {
                    console.log(`Found Cloudflare status: ${status.target_url}`);
                    return status.target_url;
                  }
                }
                
                // Method 3: Check check runs
                const checks = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: sha,
                });
                
                for (const check of checks.data.check_runs) {
                  if ((check.name.toLowerCase().includes('cloudflare') || 
                       check.name.toLowerCase().includes('pages') ||
                       check.app && check.app.slug === 'cloudflare-pages') &&
                      check.conclusion === 'success' &&
                      check.details_url) {
                    console.log(`Found Cloudflare check: ${check.details_url}`);
                    return check.details_url;
                  }
                }
                
                return null;
              } catch (error) {
                console.log(`Error checking deployment: ${error.message}`);
                return null;
              }
            }
            
            // Wait for deployment with retries
            let url = null;
            let attempts = 0;
            const maxAttempts = 30; // 5 minutes with 10s intervals
            
            while (attempts < maxAttempts && !url) {
              url = await checkDeployment();
              if (!url) {
                console.log(`Attempt ${attempts + 1}/${maxAttempts}: No deployment found, waiting...`);
                await new Promise(resolve => setTimeout(resolve, 10000));
                attempts++;
              }
            }
            
            if (url) {
              core.setOutput('deployment-url', url);
              return url;
            } else {
              console.log('No Cloudflare deployment found - this is expected if no Cloudflare integration is set up');
              core.setOutput('deployment-url', '');
              return '';
            }
            
      - name: Setup Node.js for deployed tests
        if: steps.wait-deploy.outputs.deployment-url != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies for deployed tests
        if: steps.wait-deploy.outputs.deployment-url != ''
        run: npm ci
        
      - name: Run API tests against deployed URL
        if: steps.wait-deploy.outputs.deployment-url != ''
        env:
          DEPLOYMENT_URL: ${{ steps.wait-deploy.outputs.deployment-url }}
        run: |
          echo "Running API tests against: $DEPLOYMENT_URL"
          # Create temporary configuration for deployed testing
          sed -i "s|const server = 'http://localhost:8787';|const server = '$DEPLOYMENT_URL';|g" tests/api.success.test.js
          sed -i "s|const server = 'http://localhost:8787';|const server = '$DEPLOYMENT_URL';|g" tests/api.errors.test.js
          
          # Run the tests
          npm run test:api:all
          
      - name: Install Playwright for deployed tests
        if: steps.wait-deploy.outputs.deployment-url != ''
        run: npx playwright install --with-deps
        
      - name: Run UI tests against deployed URL
        if: steps.wait-deploy.outputs.deployment-url != ''
        env:
          DEPLOYMENT_URL: ${{ steps.wait-deploy.outputs.deployment-url }}
        run: |
          echo "Running UI tests against: $DEPLOYMENT_URL"
          # Create CI config for deployed URL
          cat > playwright.deployed.config.js << EOF
          const { defineConfig, devices } = require('@playwright/test');
          
          module.exports = defineConfig({
            testDir: './tests',
            testMatch: '**/*.spec.js',
            fullyParallel: true,
            forbidOnly: !!process.env.CI,
            retries: 2,
            workers: 1,
            reporter: 'html',
            use: {
              baseURL: '$DEPLOYMENT_URL',
              trace: 'on-first-retry',
            },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
          });
          EOF
          
          # Run tests
          npx playwright test --config=playwright.deployed.config.js tests/ui.success.spec.js tests/ui.edge-cases.spec.js --reporter=list
          
      - name: Report deployment test results
        if: always()
        run: |
          if [ -z "${{ steps.wait-deploy.outputs.deployment-url }}" ]; then
            echo "ℹ️  No Cloudflare deployment detected - skipped deployment tests"
            echo "This is normal if Cloudflare Pages integration is not configured"
          else
            echo "✅ Deployment tests completed against: ${{ steps.wait-deploy.outputs.deployment-url }}"
          fi

  # Final validation - all tests must pass
  tests-complete:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests, deployed-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "API tests (local): ${{ needs.api-tests.result }}"
          echo "UI tests (local): ${{ needs.ui-tests.result }}"
          echo "Integration tests (deployed): ${{ needs.deployed-tests.result }}"
          
          # Core tests must pass
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.api-tests.result }}" != "success" ]]; then
            echo "❌ API tests failed"
            exit 1
          fi
          
          if [[ "${{ needs.ui-tests.result }}" != "success" ]]; then
            echo "❌ UI tests failed"
            exit 1
          fi
          
          # Deployed tests are optional (might skip if no deployment found)
          if [[ "${{ needs.deployed-tests.result }}" == "failure" ]]; then
            echo "❌ Deployed integration tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed successfully!"