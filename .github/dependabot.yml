# Dependabot configuration for Walk to Mordor
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"  # Run only on Mondays
      time: "06:00"  # Run at 6 AM Singapore Time
      timezone: "Asia/Singapore"
    target-branch: "main"
    
    # Limit the number of open pull requests
    open-pull-requests-limit: 10
    
    # Add labels to PRs for easier identification
    labels:
      - "dependencies"
      - "npm"
    
    # Commit message configuration
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    
    # Group dependency updates to reduce PR noise
    groups:
      # Group all development dependencies together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      
      # Group all production dependencies together
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    
    # Ignore specific packages if needed (uncomment to use)
    # ignore:
    #   - dependency-name: "package-name"
    #     versions: ["x.x.x"]

    # wrangler 4.114.0-4.125.x contains a regression where wrangler dev
    # fatally exits on a recoverable workerd crash, killing the E2E
    # webServer (cloudflare/workers-sdk#14926). Pinned to 4.113.0 in
    # package.json; ignore only the broken window so releases with the
    # fix (4.126.0+, workers-sdk#15252) are still proposed.
    ignore:
      - dependency-name: "wrangler"
        versions: [">=4.114.0 <4.126.0"]
  
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"  # Run only on Mondays
      time: "06:00"  # Run at 6 AM Singapore Time
      timezone: "Asia/Singapore"
    target-branch: "main"
    
    # Limit the number of open pull requests
    open-pull-requests-limit: 5
    
    # Add labels to PRs for easier identification
    labels:
      - "dependencies"
      - "github-actions"
    
    # Commit message configuration
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    
    # Group GitHub Actions updates together
    groups:
      github-actions:
        patterns:
          - "*"
