# Dependabot configuration for Walk to Mordor
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"  # Run only on Mondays
      time: "09:00"  # Run at 9 AM Central Time
      timezone: "America/Chicago"
    target-branch: "dev"
    
    # Limit the number of open pull requests
    open-pull-requests-limit: 5
    
    # Add labels to PRs for easier identification
    labels:
      - "dependencies"
      - "npm"
    
    # Commit message configuration
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    
    # Group dependency updates to reduce PR noise
    groups:
      # Group all development dependencies together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      
      # Group all production dependencies together
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      
      # Separate group for major version updates (more risky)
      major-updates:
        update-types:
          - "major"
    
    # Allow additional configurations
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    
    # Ignore specific packages if needed (uncomment to use)
    # ignore:
    #   - dependency-name: "package-name"
    #     versions: ["x.x.x"]
  
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"  # Run only on Mondays
      time: "09:00"  # Run at 9 AM Central Time
      timezone: "America/Chicago"
    target-branch: "dev"
    
    # Limit the number of open pull requests
    open-pull-requests-limit: 3
    
    # Add labels to PRs for easier identification
    labels:
      - "dependencies"
      - "github-actions"
    
    # Commit message configuration
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    
    # Group GitHub Actions updates together
    groups:
      github-actions:
        patterns:
          - "*"
